name: Materialize generated LastSet assets

on:
  push:
    paths:
      - 'materialize-assets.trigger'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Decode generated assets
        run: |
          set -euo pipefail
          mkdir -p assets
          cat .asset-parts/part-*.txt > /tmp/lastset-assets.b64
          base64 -d /tmp/lastset-assets.b64 > /tmp/lastset-assets.zip
          unzip -o /tmp/lastset-assets.zip -d assets
          test -s assets/hero.webp
          test -s assets/equipment.webp
      - name: Commit binary assets
        run: |
          set -euo pipefail
          rm -rf .asset-parts materialize-assets.trigger
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Add generated LastSet hero and equipment artwork'
          git push
