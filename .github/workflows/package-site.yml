name: Package LastSet site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build tested Cloudflare static asset bundle
        run: bash build-cloudflare.sh
      - name: Upload complete site
        uses: actions/upload-artifact@v4
        with:
          name: lastset-site
          path: dist/
          if-no-files-found: error
