name: LastSet Playwright Production QA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'lastset-*.js'
      - 'lastset-*.css'
      - 'service-worker.js'
      - 'worker.js'
      - 'build-cloudflare.sh'
      - 'tests/e2e/**'
      - 'playwright.config.js'
      - 'package.json'
      - '.github/workflows/playwright-production.yml'

permissions:
  contents: read

concurrency:
  group: lastset-production-playwright
  cancel-in-progress: true

env:
  LASTSET_BASE_URL: https://lastset-training-log.thiva-claimflow.workers.dev/
  CI: 'true'

jobs:
  production-e2e:
    name: Mobile browser regression
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Determine expected release ID
        shell: bash
        run: |
          # A workflow/test-only change has no new app code to deploy.
          # Source changes must still wait for the exact matching Cloudflare build.
          changed="$(git diff --name-only HEAD^ HEAD || true)"
          if printf '%s\n' "$changed" | grep -Eq '^(index\.html|lastset-.*\.(js|css)|service-worker\.js|worker\.js|build-cloudflare\.sh|scripts/stamp-release\.mjs|assets/)'; then
            echo "LASTSET_EXPECT_RELEASE=$GITHUB_SHA" >> "$GITHUB_ENV"
          else
            echo "LASTSET_EXPECT_RELEASE=" >> "$GITHUB_ENV"
          fi

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install test dependencies
        run: npm install --no-audit --no-fund

      - name: Install Chromium and WebKit
        run: npx playwright install --with-deps chromium webkit

      - name: Wait for V1 Beta production deployment
        run: |
          for attempt in $(seq 1 24); do
            html_ok=0
            beta_ok=0
            smartlog_ok=0
            memory_ok=0
            voice_ok=0
            offline_ok=0
            explore_ok=0
            anatomy_ok=0
            mobility_ok=0
            release_ok=0
            diagnostics_ok=0
            if curl --fail --silent --show-error --location --max-time 20 "$LASTSET_BASE_URL" > /tmp/lastset.html; then
              grep -q 'lastset-beta.js?v=' /tmp/lastset.html && html_ok=1 || true
              # Do not start browser tests against the previous Cloudflare release.
              if [ -n "$LASTSET_EXPECT_RELEASE" ]; then
                grep -q "lastset-release.*${LASTSET_EXPECT_RELEASE:0:12}" /tmp/lastset.html && release_ok=1 || true
              else
                grep -Eq 'lastset-release.*content="[^"]+"' /tmp/lastset.html && release_ok=1 || true
              fi
            fi
            if curl --fail --silent --show-error --location --max-time 20 "${LASTSET_BASE_URL}lastset-beta.js?v=1beta1" > /tmp/lastset-beta.js; then
              grep -q "semver: '1.0.0-beta.1'" /tmp/lastset-beta.js && grep -q "build: '0.14.1.1'" /tmp/lastset-beta.js && beta_ok=1 || true
            fi
            if curl --fail --silent --show-error --location --max-time 20 "${LASTSET_BASE_URL}lastset-smartlog-shorthand.js?v=01402" > /tmp/lastset-smartlog.js; then
              grep -q "const VERSION='0.14.0.2'" /tmp/lastset-smartlog.js && smartlog_ok=1 || true
            fi
            if curl --fail --silent --show-error --location --max-time 20 "${LASTSET_BASE_URL}lastset-memory.js?v=0134" > /tmp/lastset-memory.js; then
              grep -q "const VERSION = '0.13.4'" /tmp/lastset-memory.js && memory_ok=1 || true
            fi
            if curl --fail --silent --show-error --location --max-time 20 "${LASTSET_BASE_URL}lastset-v0140.js?v=01402" > /tmp/lastset-v0140.js; then
              grep -q "const VERSION='0.14.0.2'" /tmp/lastset-v0140.js && voice_ok=1 || true
            fi
            if curl --fail --silent --show-error --location --max-time 20 "${LASTSET_BASE_URL}lastset-offline.js?v=0141" > /tmp/lastset-offline.js; then
              grep -q "const VERSION='0.14.1'" /tmp/lastset-offline.js && offline_ok=1 || true
            fi
            if curl --fail --silent --show-error --location --max-time 20 "${LASTSET_BASE_URL}lastset-explore.js?v=0290" > /tmp/lastset-explore.js; then
              grep -q "const VERSION='0.29.0'" /tmp/lastset-explore.js && explore_ok=1 || true
            fi
            if curl --fail --silent --show-error --location --max-time 20 "${LASTSET_BASE_URL}lastset-anatomy.js?v=0282" > /tmp/lastset-anatomy.js; then
              grep -q "const VERSION='0.28.2'" /tmp/lastset-anatomy.js && anatomy_ok=1 || true
            fi
            if curl --fail --silent --show-error --location --max-time 20 "${LASTSET_BASE_URL}lastset-diagnostics.js" > /tmp/lastset-diagnostics.js; then
              grep -q "LastSetDiagnostics" /tmp/lastset-diagnostics.js && diagnostics_ok=1 || true
            fi
            if curl --fail --silent --show-error --location --max-time 20 "${LASTSET_BASE_URL}lastset-mobility.js?v=${GITHUB_SHA:0:28}" > /tmp/lastset-mobility.js; then
              grep -q 'LastSetMobility' /tmp/lastset-mobility.js && mobility_ok=1 || true
            fi
            if [ "$release_ok" -eq 1 ] && [ "$mobility_ok" -eq 1 ] && [ "$diagnostics_ok" -eq 1 ] && [ "$html_ok" -eq 1 ] && [ "$beta_ok" -eq 1 ] && [ "$smartlog_ok" -eq 1 ] && [ "$memory_ok" -eq 1 ] && [ "$voice_ok" -eq 1 ] && [ "$offline_ok" -eq 1 ] && [ "$explore_ok" -eq 1 ] && [ "$anatomy_ok" -eq 1 ]; then
              echo "LastSet V1 Beta production deployment is ready"
              exit 0
            fi
            echo "Waiting for LastSet V1 Beta production deployment. Attempt $attempt/24"
            sleep 10
          done
          echo "LastSet V1 Beta production deployment did not become ready in time"
          exit 1

      - name: Verify production suite selection
        run: |
          npm run test:e2e:production -- --list | tee /tmp/lastset-production-tests.txt
          if grep -q 'p0.trust.spec.js' /tmp/lastset-production-tests.txt; then
            echo "P0 isolated tests must not run against production"
            exit 1
          fi

      - name: Run production browser tests
        run: npm run test:e2e:production

      - name: Upload Playwright report and failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lastset-playwright-evidence
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
