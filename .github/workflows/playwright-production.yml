name: LastSet Playwright Production QA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'lastset-*.js'
      - 'lastset-*.css'
      - 'service-worker.js'
      - 'worker.js'
      - 'build-cloudflare.sh'
      - 'tests/e2e/**'
      - 'playwright.config.js'
      - 'package.json'
      - '.github/workflows/playwright-production.yml'

permissions:
  contents: read

concurrency:
  group: lastset-production-playwright
  cancel-in-progress: false

env:
  LASTSET_BASE_URL: https://lastset-training-log.thivagar2719.workers.dev/
  CI: 'true'

jobs:
  production-e2e:
    name: Mobile browser regression
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install test dependencies
        run: npm install --no-audit --no-fund

      - name: Install Chromium and WebKit
        run: npx playwright install --with-deps chromium webkit

      - name: Wait for V1 Beta production deployment
        run: |
          for attempt in $(seq 1 24); do
            html_ok=0
            beta_ok=0
            smartlog_ok=0
            if curl --fail --silent --show-error --location --max-time 20 "$LASTSET_BASE_URL" > /tmp/lastset.html; then
              grep -q 'lastset-beta.js?v=1beta1' /tmp/lastset.html && html_ok=1 || true
            fi
            if curl --fail --silent --show-error --location --max-time 20 "${LASTSET_BASE_URL}lastset-beta.js?v=1beta1" > /tmp/lastset-beta.js; then
              grep -q "semver: '1.0.0-beta.1'" /tmp/lastset-beta.js && beta_ok=1 || true
            fi
            if curl --fail --silent --show-error --location --max-time 20 "${LASTSET_BASE_URL}lastset-smartlog-shorthand.js?v=0132" > /tmp/lastset-smartlog.js; then
              grep -q "const VERSION='0.13.2'" /tmp/lastset-smartlog.js && smartlog_ok=1 || true
            fi
            if [ "$html_ok" -eq 1 ] && [ "$beta_ok" -eq 1 ] && [ "$smartlog_ok" -eq 1 ]; then
              echo "LastSet V1 Beta production deployment is ready"
              exit 0
            fi
            echo "Waiting for LastSet V1 Beta production deployment. Attempt $attempt/24"
            sleep 10
          done
          echo "LastSet V1 Beta production deployment did not become ready in time"
          exit 1

      - name: Run production browser tests
        run: npm run test:e2e

      - name: Upload Playwright report and failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lastset-playwright-evidence
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
