name: LastSet integrity tests

on:
  push:
    branches: [main, v0129-trust-data-integrity, v0130-profile-equipment, v0.11-core-reliability, v0134-memory-mvp, v0135-precor-machine-library, v0136-canonical-machine-library]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Syntax checks
        run: |
          node --check lastset-integrity.js
          node --check lastset-profile-equipment.js
          node --check lastset-navigation.js
          node --check lastset-smartlog-shorthand.js
          node --check lastset-core-reliability.js
          node --check lastset-memory.js
          node --check lastset-beta.js
          node --check service-worker.js
          node --check worker.js
          bash -n build-cloudflare.sh
      - name: Integrity smoke tests
        run: node tests/integrity-smoke.js
      - name: Profile and equipment smoke tests
        run: node tests/profile-equipment-smoke.js
      - name: Navigation smoke tests
        run: node tests/navigation-smoke.js
      - name: Smart Log shorthand smoke tests
        run: node tests/smartlog-shorthand-smoke.js
      - name: Core reliability smoke tests
        run: node tests/core-reliability-smoke.js
      - name: Memory smoke tests
        run: node tests/memory-smoke.js
      - name: Verify production bundle inputs
        run: |
          test -s lastset-integrity.js
          test -s lastset-profile-equipment.js
          test -s lastset-navigation.js
          test -s lastset-smartlog-shorthand.js
          test -s lastset-core-reliability.js
          test -s lastset-memory.js
          test -s lastset-beta.js
          test -s lastset-workouts.js
          test -s lastset-calendar.js
          test -s assets/home-hero-thiva.webp
          test -s V1_RELEASE_CHECKLIST.md
          test -s V1_BETA_RELEASE.md
          test -s V2_BACKLOG.md
          grep -q 'lastset-integrity.js' worker.js
          grep -q 'lastset-profile-equipment.js' worker.js
          grep -q 'lastset-navigation.js' worker.js
          grep -q 'lastset-smartlog-shorthand.js' worker.js
          grep -q 'lastset-core-reliability.js' worker.js
          grep -q 'lastset-memory.js' worker.js
          grep -q 'lastset-beta.js' worker.js
          grep -q 'lastset-smartlog-shorthand.js' service-worker.js
          grep -q 'lastset-core-reliability.js' service-worker.js
          grep -q 'lastset-memory.js' service-worker.js
          grep -q 'lastset-beta.js' service-worker.js
          grep -q 'lastset-smartlog-shorthand.js' build-cloudflare.sh
          grep -q 'lastset-core-reliability.js' build-cloudflare.sh
          grep -q 'lastset-memory.js' build-cloudflare.sh
          grep -q 'lastset-beta.js' build-cloudflare.sh
          bash build-cloudflare.sh
          test -s dist/lastset-smartlog-shorthand.js
          test -s dist/lastset-core-reliability.js
          test -s dist/lastset-memory.js
          test -s dist/lastset-beta.js
