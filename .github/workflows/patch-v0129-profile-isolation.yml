name: Apply v0.12.9 profile isolation patch

on:
  push:
    paths:
      - '.github/workflows/patch-v0129-profile-isolation.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch new-user isolation and regression tests
        run: |
          python - <<'PY'
          from pathlib import Path

          p=Path('lastset-integrity.js')
          s=p.read_text()
          old="""function emptyUserData(name='', previousProfile={}){
              return {
                sessions:{}, aliases:{}, machines:{},
                profile:{
                  name:String(name||'').trim(),
                  weightUnit:previousProfile.weightUnit||'kg',
                  heightCm:Number(previousProfile.heightCm)||0,
                  bodyWeightKg:Number(previousProfile.bodyWeightKg)||0,
                  progressionPreference:previousProfile.progressionPreference||'reps_first'
                },"""
          new="""function emptyUserData(name='', previousProfile={}, preserveProfile=false){
              return {
                sessions:{}, aliases:{}, machines:{},
                profile:{
                  name:String(name||'').trim(),
                  weightUnit:preserveProfile?(previousProfile.weightUnit||'kg'):'kg',
                  heightCm:preserveProfile?(Number(previousProfile.heightCm)||0):0,
                  bodyWeightKg:preserveProfile?(Number(previousProfile.bodyWeightKg)||0):0,
                  progressionPreference:preserveProfile?(previousProfile.progressionPreference||'reps_first'):'reps_first'
                },"""
          assert old in s
          s=s.replace(old,new,1)

          old="""  function switchToUser(id){
              const reg=readRegistry();
              const target=reg.users.find(u=>u.id===id);
              if(!target || !validateBackup(target.data)) return;
              syncActiveSnapshot(data);
              reg.activeId=id;"""
          new="""  function switchToUser(id){
              syncActiveSnapshot(data);
              const reg=readRegistry();
              const target=reg.users.find(u=>u.id===id);
              if(!target || !validateBackup(target.data)) return;
              reg.activeId=id;"""
          assert old in s
          s=s.replace(old,new,1)

          old="""  function createNewUser(name,deleteCurrent){
              const reg=readRegistry();
              const currentId=reg.activeId;
              if(!deleteCurrent) syncActiveSnapshot(data);
              else reg.users=reg.users.filter(u=>u.id!==currentId);
              const id=userId();
              const fresh=emptyUserData(name,data.profile||{});"""
          new="""  function createNewUser(name,deleteCurrent){
              if(!deleteCurrent) syncActiveSnapshot(data);
              const reg=readRegistry();
              const currentId=reg.activeId;
              if(deleteCurrent) reg.users=reg.users.filter(u=>u.id!==currentId);
              const id=userId();
              const fresh=emptyUserData(name);"""
          assert old in s
          s=s.replace(old,new,1)
          s=s.replace("data=emptyUserData(profile.name||'',profile);", "data=emptyUserData(profile.name||'',profile,true);", 1)
          p.write_text(s)

          t=Path('tests/integrity-smoke.js')
          q=t.read_text()
          q=q.replace("assert.equal(fresh.profile.weightUnit,'lb');", "assert.equal(fresh.profile.weightUnit,'kg');\nassert.equal(fresh.profile.heightCm,0);\nassert.equal(fresh.profile.bodyWeightKg,0);\nconst reset=T.emptyUserData('Alice',{weightUnit:'lb',heightCm:170,bodyWeightKg:70},true);\nassert.equal(reset.profile.weightUnit,'lb');\nassert.equal(reset.profile.heightCm,170);\nassert.equal(reset.profile.bodyWeightKg,70);", 1)
          t.write_text(q)
          PY
          node --check lastset-integrity.js
          node tests/integrity-smoke.js
      - name: Commit patch and remove one-time workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/patch-v0129-profile-isolation.yml
          git add lastset-integrity.js tests/integrity-smoke.js
          git commit -m 'Fix new user profile isolation in v0.12.9'
          git push
