name: Fix v0.13.0 band assisted semantics

on:
  push:
    paths:
      - '.github/workflows/v0130-band-assist-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Correct band assisted pull up progression semantics
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('lastset-profile-equipment.js')
          s=p.read_text()
          old="{id:'band-assisted-pull-up',name:'Band Assisted Pull Up',equipment:'Resistance Band',muscles:['Back','Biceps'],primaryMuscle:'Back',secondaryMuscles:['Biceps'],filterMuscles:['Back','Biceps'],movement:'Vertical Pull',loadType:'band',aliases:"
          new="{id:'band-assisted-pull-up',name:'Band Assisted Pull Up',equipment:'Resistance Band',muscles:['Back','Biceps'],primaryMuscle:'Back',secondaryMuscles:['Biceps'],filterMuscles:['Back','Biceps'],movement:'Vertical Pull',loadType:'assisted',aliases:"
          if old not in s:
              raise SystemExit('Expected band assisted exercise definition not found')
          p.write_text(s.replace(old,new,1))

          t=Path('tests/profile-equipment-smoke.js')
          x=t.read_text()
          needle="assert.ok(sandbox.EXERCISES.some(e=>e.id==='band-assisted-pull-up'),'Band Assisted Pull Up missing');"
          addition=needle+"\nassert.equal(sandbox.EXERCISES.find(e=>e.id==='band-assisted-pull-up').loadType,'assisted','Band assisted pull up must progress by reducing assistance');"
          if needle not in x:
              raise SystemExit('Expected band assisted smoke assertion not found')
          t.write_text(x.replace(needle,addition,1))
          PY
          rm .github/workflows/v0130-band-assist-fix.yml
      - name: Commit correction
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lastset-profile-equipment.js tests/profile-equipment-smoke.js .github/workflows/v0130-band-assist-fix.yml
          git commit -m 'Fix band assisted pull up progression semantics'
          git push
