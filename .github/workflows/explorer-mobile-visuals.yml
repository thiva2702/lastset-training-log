name: LastSet Muscle Explorer mobile visuals

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/explorer-mobile-visuals.yml'
      - 'lastset-anatomy.js'
      - 'lastset-anatomy.css'
      - 'lastset-explore.js'
      - 'lastset-explore.css'
      - 'lastset-atlas-regions.js'
      - 'assets/anatomy-*.webp'
      - 'index.html'
      - 'scripts/restore-anatomy-detail.mjs'
      - 'build-cloudflare.sh'
      - 'package.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lastset-explorer-visuals
  cancel-in-progress: true

env:
  LASTSET_BASE_URL: https://lastset-training-log.thiva-claimflow.workers.dev/
  CI: 'true'

jobs:
  mobile-visuals:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout LastSet
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium webkit
      - name: Targeted anatomy and forearm tests
        run: npx playwright test --grep "Premium anatomy atlas|Forearm atlas tap|Biceps offers only|Triceps offers|Female muscle model|Female back anatomy|Muscle Explorer filters|Atlas uses source pixel" --project=mobile-chromium --project=mobile-webkit
      - name: Verify WebKit offline cache readiness
        run: npx playwright test --grep "offline cache is installed" --project=mobile-webkit
      - name: Capture mobile front, back and selected anatomy
        if: always()
        run: |
          node <<'NODE'
          const {chromium,devices}=require('@playwright/test');
          const assert=require('node:assert/strict');
          const fs=require('node:fs');
          (async()=>{
            fs.mkdirSync('test-results',{recursive:true});
            const browser=await chromium.launch();
            try {
              const context=await browser.newContext({...devices['iPhone 13'],timezoneId:'Asia/Kuala_Lumpur'});
              const page=await context.newPage();
              await page.goto(process.env.LASTSET_BASE_URL,{waitUntil:'domcontentloaded'});
              await page.locator('#ls-onboard-name').fill('LastSet Visual QA');
              await page.locator('#ls-onboard-unit').selectOption('kg');
              await page.locator('[data-onboard-save]').click();
              await page.locator('[data-start="day"]').click();
              await page.locator('[data-nav="explore"]').click();
              await page.locator('.ls-anatomy-premium.male').waitFor();
              for(const side of ['front','back']){
                await page.locator('[data-explore-side="'+side+'"]').click();
                const facts=await page.evaluate(()=>{
                  const svg=document.querySelector('.ls-anatomy-premium');
                  const stage=document.querySelector('.ls-anatomy-stage');
                  const photo=svg?.querySelector('image.ls-realistic-anatomy');
                  const sr=stage?.getBoundingClientRect(),fr=svg?.getBoundingClientRect();
                  return {viewport:window.innerWidth,document:document.documentElement.scrollWidth,
                    stageWidth:sr?.width,stageBottom:sr?.bottom,navTop:document.querySelector('.bottom-nav')?.getBoundingClientRect()?.top,figureWidth:fr?.width,figureHeight:fr?.height,
                    image:photo?.getAttribute('href'),groups:svg?.querySelectorAll('[data-explore-group]').length,viewBox:svg?.getAttribute('viewBox'),visuals:svg?.querySelectorAll('.ls-atlas-visual').length};
                });
                assert(facts.document<=facts.viewport+2,'Horizontal overflow: '+JSON.stringify(facts));
                assert(facts.figureHeight>=400,'Full body figure is too small for practical muscle selection: '+JSON.stringify(facts));
                assert(facts.image?.includes('anatomy-'+side+'.webp'),'Photographic atlas missing: '+side);
                assert(facts.figureHeight>=400&&facts.groups>=4&&facts.visuals>=15,'Anatomy overlays failed to render: '+JSON.stringify(facts));
                assert(facts.viewBox==='0 0 '+(side==='front'?346:356)+' 631','Photo and overlay coordinates do not match source image: '+JSON.stringify(facts));
                const asset=await page.request.get(new URL(facts.image,process.env.LASTSET_BASE_URL).toString());
                assert(asset.ok(),'Anatomy image did not load: '+side);
                await page.screenshot({path:'test-results/lastset-'+side+'-iphone.png'});
                console.log(side+' '+JSON.stringify(facts));
              }
              await page.locator('[data-explore-side="front"]').click();
              await page.locator('.ls-anatomy-premium [data-anatomy-region="Forearms"]').first().click();
              await page.locator('[data-explore-subregion="Wrist Flexors"]').click();
              await page.locator('[data-explore-exercise="barbell-wrist-curl"]').waitFor();
              const focused=await page.evaluate(()=>{
                const selected=document.querySelector('.ls-atlas-visual.ls-region-selected');
                const sheet=document.querySelector('.ls-explore-sheet');
                const sel=selected?.getBoundingClientRect(),sh=sheet?.getBoundingClientRect();
                return {muscleCenter:sel?(sel.top+sel.bottom)/2:null,sheetTop:sh?.top};
              });
              assert(focused.muscleCenter<focused.sheetTop-10,'Focused muscle is obscured by exercise sheet: '+JSON.stringify(focused));
              await page.screenshot({path:'test-results/lastset-forearm-iphone.png'});
              await page.locator('[data-explore-close]').click();
              await page.locator('.ls-atlas-hit[data-anatomy-region="Biceps"]').first().click();
              await page.locator('[data-explore-subregion="Long Head"]').click();
              await page.locator('.ls-specialist-visual.ls-region-selected').first().waitFor();
              const pair=await page.evaluate(()=>{
                const model=document.querySelector('.ls-anatomy-stage').getBoundingClientRect();
                const panel=document.querySelector('.ls-explore-sheet').getBoundingClientRect();
                const highlight=document.querySelector('.ls-specialist-visual.ls-region-selected');
                const purple=document.querySelector('.ls-atlas-visual:not(.ls-region-selected)');
                return {gap:panel.top-model.bottom,green:getComputedStyle(highlight).fill,purple:getComputedStyle(purple).fill};
              });
              assert(pair.gap>0,'Biceps drilldown overlaps body: '+JSON.stringify(pair));
              assert(pair.green!==pair.purple,'Biceps specialist highlight is not distinguishable: '+JSON.stringify(pair));
              await page.screenshot({path:'test-results/lastset-biceps-specialist-iphone.png',fullPage:true});

              await page.locator('[data-explore-close]').click();
              await page.locator('.ls-anatomy-premium .ls-atlas-hit[data-anatomy-region="Quads"]').first().click();
              await page.locator('.ls-sheet-head strong').waitFor();
              const legs=await page.evaluate(()=>{
                const green=document.querySelector('.ls-atlas-group.active .ls-region-selected');
                const sheet=document.querySelector('.ls-explore-sheet');
                const gr=green?.getBoundingClientRect(),sr=sheet?.getBoundingClientRect();
                return {selection:document.querySelector('.ls-sheet-head strong')?.textContent,center:gr?(gr.top+gr.bottom)/2:null,sheetTop:sr?.top};
              });
              assert.equal(legs.selection,'Quads','The Quads tap did not select Quads');
              assert(legs.center<legs.sheetTop-10,'Selected Quads are covered by exercise sheet: '+JSON.stringify(legs));
              await page.screenshot({path:'test-results/lastset-quads-iphone.png'});
              await page.evaluate(() => {
                const key='lastset-data-v1';
                const raw=localStorage.getItem(key);
                const current=raw?JSON.parse(raw):{};
                current.profile=current.profile||{};
                current.profile.gender='Female';
                localStorage.setItem(key,JSON.stringify(current));
              });
              await page.reload({waitUntil:'domcontentloaded'});
              await page.locator('[data-nav="explore"]').click();
              await page.locator('.ls-anatomy-premium.female').waitFor();
              const frontVisuals=await page.locator('.ls-anatomy-premium.female .ls-atlas-visual').count();
              assert(frontVisuals>=20,'Female front anatomy missing selectable colored regions');
              await page.screenshot({path:'test-results/lastset-female-front-iphone.png',fullPage:true});
              await page.locator('.ls-anatomy-premium.female [data-anatomy-region="Biceps"]').first().click();
              await page.locator('[data-explore-subregion="Long Head"]').click();
              await page.locator('.ls-anatomy-premium.female .ls-specialist-visual.ls-region-selected').first().waitFor();
              await page.locator('[data-focus-kind="primary"] [data-explore-exercise="incline-biceps-curl"]').waitFor();
              const gap=await page.evaluate(()=>{
                const figure=document.querySelector('.ls-anatomy-stage').getBoundingClientRect();
                const panel=document.querySelector('.ls-explore-sheet').getBoundingClientRect();
                return panel.top-figure.bottom;
              });
              assert(gap>0,'Female specialist sheet overlaps anatomy: '+gap);
              await page.screenshot({path:'test-results/lastset-female-biceps-iphone.png',fullPage:true});
              await page.locator('[data-explore-side="back"]').click();
              await page.locator('.ls-anatomy-premium.female.ls-anatomy-back').waitFor();
              await page.screenshot({path:'test-results/lastset-female-back-iphone.png',fullPage:true});
              console.log('Mobile male/female front/back, specialist highlights, exercise sections and inline layout passed');
            } finally {
              await browser.close();
            }
          })().catch(err=>{console.error(err);process.exit(1)});
          NODE
      - name: Upload screenshots and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lastset-explorer-mobile-visuals
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 14
