<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#090713">
  <title>LastSet</title>
  <style>
    html,body{margin:0;min-height:100%;background:#07060d;color:#fff;font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    .boot{min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 70% 15%,rgba(135,66,199,.32),transparent 28%),#07060d}
    .boot-inner{text-align:center}.mark{font-size:30px;font-weight:850;letter-spacing:-1px}.mark span{color:#adff4f}.sub{margin-top:8px;color:#aaa3bc;font-size:12px}.pulse{width:34px;height:4px;border-radius:99px;background:#adff4f;margin:18px auto 0;box-shadow:0 0 22px rgba(173,255,79,.55);animation:p 1s ease-in-out infinite alternate}@keyframes p{to{opacity:.3;transform:scaleX(.55)}}
  </style>
</head>
<body>
  <div class="boot"><div class="boot-inner"><div class="mark">Last<span>Set</span></div><div class="sub">Remember today. Build tomorrow.</div><div class="pulse"></div></div></div>
  <script>
    (async()=>{
      try{
        if('serviceWorker' in navigator){
          const regs=await navigator.serviceWorker.getRegistrations();
          await Promise.all(regs.map(r=>r.unregister()));
        }
        if('caches' in window){
          const keys=await caches.keys();
          await Promise.all(keys.map(k=>caches.delete(k)));
        }
      }catch(_){ }
      try{
        const res=await fetch('/index.html?legacy=0122',{cache:'no-store'});
        let html=await res.text();
        const headInject=`\n<link rel="stylesheet" href="/lastset-theme.css?v=0122">\n<link rel="stylesheet" href="/lastset-premium.css?v=0122">\n<link rel="stylesheet" href="/lastset-images.css?v=0122">\n<meta name="theme-color" content="#090713">\n`;
        const bodyInject=`\n<script src="/lastset-enhancements.js?v=0122"><\/script>\n<script src="/lastset-premium.js?v=0122"><\/script>\n`;
        html=html.replace('</head>',headInject+'</head>').replace('</body>',bodyInject+'</body>');
        document.open();
        document.write(html);
        document.close();
      }catch(err){
        document.body.innerHTML='<div class="boot"><div class="boot-inner"><div class="mark">Last<span>Set</span></div><div class="sub">Could not load the training log. Refresh once and try again.</div></div></div>';
        console.error('LastSet bootstrap error',err);
      }
    })();
  </script>
</body>
</html>
