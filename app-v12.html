<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#090713">
  <title>LastSet</title>
  <style>
    html,body{margin:0;min-height:100%;background:#07050d;color:#fff;font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    .boot{min-height:100vh;display:grid;place-items:center;padding:calc(24px + env(safe-area-inset-top,0px)) 24px calc(24px + env(safe-area-inset-bottom,0px));background:radial-gradient(circle at 50% 37%,rgba(118,43,190,.28),transparent 27%),radial-gradient(circle at 50% 58%,rgba(74,25,121,.13),transparent 37%),#07050d}
    .boot-inner{text-align:center;transform:translateY(-3vh)}
    .boot-icon{width:96px;height:96px;border-radius:26px;filter:drop-shadow(0 0 25px rgba(131,47,224,.34))}
    .boot-word{margin-top:18px;display:flex;align-items:center;justify-content:center;font-size:35px;font-weight:880;letter-spacing:-1.4px;line-height:1}
    .boot-word .last{color:#fff}.boot-word .set{background:linear-gradient(180deg,#efcaff,#bd65ff 44%,#7627ff);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
    .boot-beta{margin-left:9px;padding:4px 8px;border:1px solid rgba(183,98,255,.55);border-radius:999px;color:#dfc8f2;font-size:8px;font-weight:900;letter-spacing:1.3px}
    .sub{margin-top:9px;color:#aaa2b7;font-size:11px}
    .pulse{height:15px;margin:20px auto 0;display:flex;align-items:flex-end;justify-content:center;gap:3px}.pulse i{display:block;width:3px;border-radius:4px;background:linear-gradient(#d79cff,#7a2cff);box-shadow:0 0 10px rgba(144,64,229,.45);animation:p 1s ease-in-out infinite alternate}.pulse i:nth-child(1){height:5px;animation-delay:-.4s}.pulse i:nth-child(2){height:9px;animation-delay:-.2s}.pulse i:nth-child(3){height:14px}@keyframes p{to{opacity:.35;transform:translateY(1px)}}@media(prefers-reduced-motion:reduce){.pulse i{animation:none}}
  </style>
</head>
<body>
  <div class="boot"><div class="boot-inner">
    <img class="boot-icon" src="/assets/lastset-mark.svg?v=0139" alt="">
    <div class="boot-word"><span class="last">Last</span><span class="set">Set</span><span class="boot-beta">BETA</span></div>
    <div class="sub">Remember today. Build tomorrow.</div>
    <div class="pulse"><i></i><i></i><i></i></div>
  </div></div>
  <script>
    (async()=>{
      try{
        let html='';
        try{
          const res=await fetch('/index.html?legacy=0141',{cache:'no-store'});
          if(!res.ok)throw new Error('network');
          html=await res.text();
        }catch(networkError){
          if('caches' in window){
            const cached=await caches.match('/index.html',{ignoreSearch:true})||await caches.match('./index.html',{ignoreSearch:true});
            if(cached)html=await cached.text();
          }
          if(!html)throw networkError;
        }

        const headInject=`\n<link rel="stylesheet" href="/lastset-theme.css?v=0138">\n<link rel="stylesheet" href="/lastset-premium.css?v=0138">\n<link rel="stylesheet" href="/lastset-images.css?v=0132">\n<link rel="stylesheet" href="/lastset-brand.css?v=0139">\n<link rel="stylesheet" href="/lastset-identity.css?v=01310">\n<link rel="stylesheet" href="/lastset-v0140.css?v=01402">\n<link rel="stylesheet" href="/lastset-onboarding.css?v=0140">\n<link rel="stylesheet" href="/lastset-offline.css?v=0141">\n<link rel="stylesheet" href="/lastset-explore.css?v=0141">\n<meta name="theme-color" content="#090713">\n`;
        const bodyInject=`\n<script src="/lastset-enhancements.js?v=0132"><\/script>\n<script src="/lastset-premium.js?v=0132"><\/script>\n<script src="/lastset-hotfix.js?v=0132"><\/script>\n<script src="/lastset-smartlog-shorthand.js?v=01402"><\/script>\n<script src="/lastset-core-reliability.js?v=0133"><\/script>\n<script src="/lastset-memory.js?v=0134"><\/script>\n<script src="/lastset-intelligence.js?v=0137"><\/script>\n<script src="/lastset-calendar.js?v=0132"><\/script>\n<script src="/lastset-workouts.js?v=0132"><\/script>\n<script src="/lastset-integrity.js?v=0132"><\/script>\n<script src="/lastset-profile-equipment.js?v=0135"><\/script>\n<script src="/lastset-navigation.js?v=0141"><\/script>\n<script src="/lastset-beta.js?v=1beta1"><\/script>\n<script src="/lastset-brand.js?v=0139"><\/script>\n<script src="/lastset-identity.js?v=01401"><\/script>\n<script src="/lastset-v0140.js?v=01402"><\/script>\n<script src="/lastset-onboarding.js?v=0140"><\/script>\n<script src="/lastset-offline.js?v=0141"><\/script>\n<script src="/lastset-explore.js?v=0141"><\/script>\n`;
        if(!html.includes('lastset-offline.css'))html=html.replace('</head>',headInject+'</head>');
        if(!html.includes('lastset-offline.js'))html=html.replace('</body>',bodyInject+'</body>');
        document.open();
        document.write(html);
        document.close();
      }catch(err){
        document.body.innerHTML='<div class="boot"><div class="boot-inner"><img class="boot-icon" src="/assets/lastset-mark.svg?v=0139" alt=""><div class="boot-word"><span class="last">Last</span><span class="set">Set</span></div><div class="sub">LastSet could not open. Connect once, reopen the app, then it will be available offline.</div></div></div>';
        console.error('LastSet bootstrap error',err);
      }
    })();
  </script>
</body>
</html>
