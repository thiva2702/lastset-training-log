[build]
  publish = "."

[[redirects]]
  from = "/"
  to = "/app-v12.html"
  status = 200
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(self), microphone=(self)"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-store, max-age=0"

[[headers]]
  for = "/app-v12.html"
  [headers.values]
    Cache-Control = "no-store, max-age=0"

[[headers]]
  for = "/service-worker.js"
  [headers.values]
    Cache-Control = "no-store, max-age=0"
